<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>이미지 압축 사이트</h1>
            <p>용량은 줄이면서 이미지 품질은 지켜보세요</p>
        </header>

        <div class="main-layout">
            <!-- LEFT SIDEBAR -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>Image Quality</h3>
                    <div class="quality-display">
                        <span id="quality-value">85</span>%
                    </div>
                    <input type="range" id="quality-slider" min="0" max="100" value="85" step="5">
                </div>

                <div class="sidebar-section">
                    <h3>Output Format</h3>
                    <div class="format-buttons">
                        <label class="format-btn">
                            <input type="radio" name="format" value="jpeg" checked>
                            <span>JPG</span>
                        </label>
                        <label class="format-btn">
                            <input type="radio" name="format" value="png">
                            <span>PNG</span>
                        </label>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Progress</h3>
                    <div class="progress-info">
                        <span id="progress-text">0 / 0</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Total Saved</h3>
                    <div class="total-saved" id="total-saved">0 MB</div>
                </div>

                <button id="download-all-btn" class="download-all-btn" style="display: none;">
                    Download All as ZIP
                </button>
            </aside>

            <!-- RIGHT MAIN AREA -->
            <main class="main-area">
                <div class="upload-zone" id="drop-zone">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16L12 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <path d="M9 11L12 8L15 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <path d="M8 16H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                    </svg>
                    <h2>Drag & Drop your images here</h2>
                    <p>or</p>
                    <label for="file-input" class="browse-btn">Browse Files</label>
                    <input type="file" id="file-input" accept=".jpg,.jpeg,.png" multiple hidden>
                    <p class="hint">Supports JPG, PNG</p>
                </div>

                <div class="file-list-header" id="file-list-header" style="display: none;">
                    <h3>Processed Files</h3>
                    <button id="clear-all-btn" class="clear-all-btn">🗑️ Clear All</button>
                </div>

                <div class="file-list" id="file-list">
                    <!-- Files will be added here dynamically -->
                </div>
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
